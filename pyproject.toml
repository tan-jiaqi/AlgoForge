[project]
name = "algoforge"
version = "1.0.0"
description = "Agent-based algorithm capability factory: extract -> synthesize -> verify -> curate"
requires-python = ">=3.11"

[project.scripts]
algoforge = "factory.cli:app"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: 完整演示回放等耗时测试，用 pytest -m slow 运行"]
